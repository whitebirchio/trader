# Build every push; migrate and deploy only main (ADR-018: production is the
# only deployed environment). AWS deploys use GitHub OIDC (no stored keys):
# the trader-github-deploy role can only assume CDK's bootstrap roles
# (SPEC-platform-aws).
#   - any branch other than main → build, test, and a migration check on a
#                                  temporary Neon branch of production
#   - main                       → TraderProduction (live money)
# Migrations run before the Worker deploys, so new code never meets an old
# schema. Secrets are repo-level (no GitHub Environments: the org is on the
# Free plan). The repo is public, so its run logs are too: never echo a secret.
#
# Only `push` triggers builds: every PR branch is pushed anyway, and its
# checks show on the PR, so a pull_request trigger would just run them twice.
name: CI

permissions:
  contents: read
  id-token: write # OIDC token for aws-actions/configure-aws-credentials

on:
  push:
  # Manual re-run of the current branch's pipeline without a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the secret scan reads all of history
      # The repo is public: a secret in any commit is a leak, so scan every
      # commit with .gitleaks.toml. Pinned and checksum-verified.
      - name: Scan history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The dashboard's packaged code is a CDK asset, so build it before synth.
      - run: npm run build -w trader-dashboard
      # Infra errors fail every branch, not just deploys (no AWS credentials needed to synth).
      - run: npm run synth -w trader-infra

  # Branches don't deploy (ADR-018), so their migrations are checked here, on a
  # temporary copy of production that the script deletes. It prints only pass
  # or fail: the copy holds live data, and these logs are public.
  migrate-check:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate a temporary copy of production
        run: scripts/ci-migrate-check.sh
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate Neon production branch
        run: npm run db:migrate -w @trader/core
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATE_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm run build -w trader-dashboard
      - name: Deploy TraderProduction (AWS)
        run: npm run deploy:production -w trader-infra
